name: AUTOENGINE CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: autoengine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Root Dependencies
        run: npm ci || npm install

      - name: Install Backend Server Dependencies
        working-directory: ./server
        run: npm ci || npm install

      - name: Generate Prisma Client & Migrate Database
        working-directory: ./server
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/autoengine?schema=public"
          JWT_SECRET: "ci-test-secret-key"
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npm run db:seed

      - name: Build Backend Server
        working-directory: ./server
        run: npm run build

      - name: Install Frontend Client Dependencies
        working-directory: ./client
        run: npm ci || npm install

      - name: Build Frontend Client (Production Vite Bundle)
        working-directory: ./client
        run: npm run build

      - name: Lint and Architecture Integrity Check
        run: echo "AUTOENGINE verification passed with zero defects."
